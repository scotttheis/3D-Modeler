name: Bug report
description: Something is broken or does not do what you expect.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you clicked, in order. A small model file helps if you can share one.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 3D Modeler version
      description: Shown on the Releases page you downloaded from.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log file
      description: "modeler3d.log (see CONTRIBUTING.md for where it is). Remove anything private."
      render: text
