[workspace]
resolver = "2"
members = [
    "crates/modeler3d-core",
    "crates/modeler3d-platform",
    "crates/modeler3d-mcp",
    "crates/modeler3d-viewport",
    "crates/modeler3d-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
modeler3d-core = { path = "crates/modeler3d-core" }
modeler3d-platform = { path = "crates/modeler3d-platform" }
modeler3d-mcp = { path = "crates/modeler3d-mcp" }
modeler3d-viewport = { path = "crates/modeler3d-viewport" }
modeler3d-app = { path = "crates/modeler3d-app" }
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "wayland", "wgpu", "x11"] }
image = { version = "=0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "pnm", "tga", "tiff", "webp"] }
fontdue = "=0.9.5"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
manifold-csg = "=0.4.1"
quick-xml = { version = "=0.42.0", default-features = false }
qhull = { git = "https://github.com/LucaCiucci/qhull-rs.git", rev = "62e810ccf93b458470f03cae6ef4df26023d2260" }
rfd = "=0.17.2"
raw-window-handle = "=0.6.2"
sysinfo = { version = "=0.40.0", default-features = false, features = ["system"] }
thiserror = "=2.0.21"
tokio = { version = "=1.51.6", features = ["macros", "rt-multi-thread"] }
uuid = { version = "=1.29.0", default-features = false, features = ["std", "v4"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["dx12", "gles", "vulkan", "wgsl"] }
windows = { version = "=0.62.2", default-features = false, features = ["Foundation", "Foundation_Collections", "Graphics_Printing3D", "Storage_Streams", "Win32_System_WinRT", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com"] }
zip = { version = "=9.1.3", default-features = false, features = ["deflate"] }

# The shipping profile keeps the renderer fast; the size profile exists to
# measure the installed-size target honestly.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.size]
inherits = "release"
opt-level = "z"

# Day-to-day visual review builds: release speed without the fat-LTO link,
# which takes minutes and has run LLVM out of memory on the development host.
# Ship and measure with `release`; iterate and capture with `review`.
[profile.review]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
